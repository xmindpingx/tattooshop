# Project config for /home/dad/www/tattooshop. Overrides ~/.aider.conf.yml.
# Launch with ./start_aider.sh (pre-warms both models, unloads them on exit).
#
# Default architect: gemini/gemini-2.5-pro (set by start_aider.sh, sourced from ~/.aider-secrets).
# Use --flash for gemini-2.5-flash (faster/cheaper), --model ollama_chat/gemma4:12b for fully local.
# Editor: ollama_chat/qwen2.5-coder:7b-instruct (local GPU, 16k window). Both in ~/.aider.model.settings.yml.
# The project is shaped around the 16k editor window: small files, ~1.3k tokens of rules, presets in tools/aider/.

# Rules + architecture facts, read-only. In architect mode the editor model receives these too and has
# only 16384 tokens in total, so keep them short (measure with: /tokens).
read:
  - CONVENTIONS.md
  - ARCHITECTURE.md

# Lint after every edit; problems go back to the model to fix. JavaScript uses tools/lint_js.js
# (syntax, undefined names, duplicate declarations across public/js/*.js). Python uses aider's built-in
# flake8 check (syntax + undefined names).
auto-lint: true
lint-cmd:
  - "javascript: node tools/lint_js.js"

# /test runs tools/check.sh: JS + Python static checks and a headless-Chrome load of the live page.
# About 2 seconds, no GPU, read-only (GET only, no mutation). Confirmed 2026-10-06 (read the
# script) -- safe to run after every edit so a claimed fix is actually checked.
test-cmd: tools/check.sh
auto-test: true

# ── show real diffs, not just the chat narration ───────────────────────────
show-diffs: true

# Do not let aider append '.aider*' to .gitignore: that would also ignore this file and .aiderignore.
# Aider's runtime files are listed in .gitignore explicitly.
gitignore: false

# Short, plain, one-line commit messages from a small local model.
commit-prompt: |
  Write the git commit message for the diff the user sends.
  Output exactly one line, at most 72 characters, imperative mood, no quotes, no markdown, no trailing period, no explanation.
  Start with the area and a colon, using one of: ui, css, server, engine, gen, tools, docs.
  Example: server: add /api/gen/cancel route

# The assistant must not propose shell commands to run on a live server.
suggest-shell-commands: false
analytics-disable: true
